name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  # publish.yml runs these checks against the tagged tree before it builds an
  # image, which a tag push would otherwise skip: the `push` filter above is
  # branches only.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with `packageManager` in package.json: bunko refuses a
          # mismatch, and the lockfile is resolved by this exact version.
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
